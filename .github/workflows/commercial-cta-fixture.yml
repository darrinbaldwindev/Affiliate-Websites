name: Commercial CTA fixture validation

on:
  push:
    branches: [main]
    paths:
      - 'fixtures/commercial-cta/**'
      - 'fixtures/uk-vertical-slice/**'
      - '.github/workflows/commercial-cta-fixture.yml'
  pull_request:
    paths:
      - 'fixtures/commercial-cta/**'
      - 'fixtures/uk-vertical-slice/**'
      - '.github/workflows/commercial-cta-fixture.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate synthetic country CTA fixture
        run: python fixtures/commercial-cta/validate_country_cta.py fixtures/commercial-cta/country-programs.synthetic.json
      - name: Validate governed UK CTA fixture
        run: python fixtures/commercial-cta/validate_country_cta.py fixtures/commercial-cta/uk-governance.synthetic.json
      - name: Validate UK technology vertical slice fixture
        run: python fixtures/uk-vertical-slice/validate_uk_vertical_slice.py fixtures/uk-vertical-slice/technology-appliances.synthetic.json fixtures/commercial-cta/uk-governance.synthetic.json
      - name: Validate synthetic Software & Games offer fixture
        run: python fixtures/commercial-cta/validate_software_games_offer.py fixtures/commercial-cta/software-games-offers.synthetic.json
      - name: Run governed CTA and Software & Games assurance cases
        working-directory: fixtures/commercial-cta
        run: python -m unittest -v test_country_cta.py test_software_games_offer.py test_software_games_ranking.py test_uk_audit_reasons.py
      - name: Run UK vertical-slice negative cases
        working-directory: fixtures/uk-vertical-slice
        run: python -m unittest -v test_uk_vertical_slice.py
